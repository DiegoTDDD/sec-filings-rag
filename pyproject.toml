[project]
name = "sec-filings-rag"
version = "1.0.0"
description = "RAG system for querying SEC 10-K/10-Q filings with source-cited answers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Diego Alves" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E402"]
