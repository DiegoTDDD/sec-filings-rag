name: How-to-run check

# Runs the README "Running it" section for real on Linux, including step 4 (ingestion from the SEC,
# chunking and embedding with Ollama) and the questions asked through the CLI and the API.
# It is heavy (Ollama models, SEC downloads, embedding thousands of chunks on a CPU), so it runs when this
# file changes, every month, and on demand ("Run workflow").
on:
  workflow_dispatch:
  schedule:
    - cron: "47 5 1 * *"
  push:
    paths:
      - ".github/workflows/howto-check.yml"

permissions:
  contents: read
  actions: write   # only used to keep the monthly schedule enabled (see last step)

env:
  PIP_NO_CACHE_DIR: "1"

jobs:
  readme-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (torch, the Ollama models and the filings need it)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "README step 2: install the dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-deps -r requirements-pillow.txt

      - name: "README prerequisite: Ollama with nomic-embed-text and llama3.2:3b"
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (pgrep -x ollama >/dev/null || nohup ollama serve > ollama.log 2>&1 &)
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:11434/api/tags >/dev/null; then echo "ollama is up"; break; fi
            sleep 2
          done
          ollama pull nomic-embed-text
          ollama pull llama3.2:3b
          ollama list

      - name: "README step 3: Qdrant with the exact command"
        run: |
          docker run -d --name qdrant -p 127.0.0.1:6333:6333 -p 127.0.0.1:6334:6334 \
            -v "$(pwd)/qdrant_storage:/qdrant/storage" qdrant/qdrant
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:6333/ >/dev/null; then echo "qdrant is up"; break; fi
            sleep 2
          done

      - name: "README step 4: python src/ingestion/ingest.py (downloads the filings from the SEC)"
        run: |
          python src/ingestion/ingest.py 2>&1 | tail -40
          python - <<'PY'
          import glob, json, sys
          files = glob.glob("data/processed/*.txt")
          meta = json.load(open("data/processed/metadata.json")) if glob.glob("data/processed/metadata.json") else []
          tickers = sorted({f.split("/")[-1].split("_")[0] for f in files})
          print(f"{len(files)} section files | tickers: {tickers} | metadata records: {len(meta)}")
          if len(files) < 10 or tickers != ["AAPL", "JPM", "NVDA"]:
              print(f"::error::ingestion produced {len(files)} files for {tickers}")
              sys.exit(1)
          PY

      - name: "README step 4: python src/indexing/chunk.py"
        run: |
          python src/indexing/chunk.py 2>&1 | tail -6
          python -c "import json; c=json.load(open('data/processed/chunks.json')); print(len(c), 'chunks'); assert len(c) > 500"

      - name: "README step 4: python src/indexing/index_qdrant.py (embeds every chunk with Ollama)"
        run: |
          python src/indexing/index_qdrant.py 2>&1 | tail -6
          curl -s http://127.0.0.1:6333/collections/sec_filings | tee collection.json
          python - <<'PY'
          import json
          n = json.load(open("collection.json"))["result"]["points_count"]
          chunks = len(json.load(open("data/processed/chunks.json")))
          print(f"points in Qdrant: {n} | chunks: {chunks}")
          assert n == chunks, (n, chunks)
          PY

      - name: "README: ask from the CLI"
        run: |
          python src/retrieval/rag.py "How does NVIDIA describe export control risk?" | tee ask.txt
          python - <<'PY'
          text = open("ask.txt", encoding="utf-8").read()
          answer = text.split("ANSWER")[1].split("SOURCES")[0]
          sources = text.split("SOURCES")[1]
          print("answer characters:", len(answer.strip()), "| NVDA in sources:", "NVDA" in sources)
          assert len(answer.strip()) > 150 and "NVDA" in sources
          PY

      - name: "README step 5: the API answers /health and /ask"
        run: |
          nohup python -m uvicorn api.main:app --port 8000 > api.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8000/health >/dev/null; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health
          echo
          curl -sf -X POST http://127.0.0.1:8000/ask -H 'content-type: application/json' \
            -d '{"question":"What are the main risk factors Apple mentions?","ticker":"AAPL"}' | tee ask.json
          python - <<'PY'
          import json
          d = json.load(open("ask.json"))
          print("answer characters:", len(d["answer"]), "| sources:", len(d["sources"]), "| first:", d["sources"][:1])
          assert len(d["answer"]) > 100 and d["sources"] and all(s["ticker"] == "AAPL" for s in d["sources"])
          PY

      - name: "README step 5: the dashboard starts"
        run: |
          nohup python -m streamlit run dashboard/app.py --server.headless true --server.port 8501 > dashboard.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:8501/_stcore/health >/dev/null; then echo "dashboard is up on port 8501"; exit 0; fi
            sleep 2
          done
          tail -30 dashboard.log
          exit 1

      - name: Show the logs on failure
        if: failure()
        run: |
          tail -30 ollama.log || true
          tail -30 api.log || true
          docker logs qdrant 2>&1 | tail -15 || true

      - name: Clean up
        if: always()
        run: docker rm -f qdrant || true

      - name: Keep the monthly schedule enabled
        if: ${{ always() && github.event_name == 'schedule' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/howto-check.yml/enable"
