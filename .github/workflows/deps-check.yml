name: Dependency check

# Installs the pinned requirements.txt from scratch on Linux, Windows and Apple Silicon
# macOS, checks there are no conflicts, imports the key libraries, compiles the
# source, checks sentence splitting and loads the reranker model.
on:
  push:
    paths:
      - requirements.txt
      - ".github/workflows/deps-check.yml"
  workflow_dispatch:

env:
  PIP_NO_CACHE_DIR: "1"

jobs:
  install:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check

      - name: Import the key libraries
        run: |
          python - <<'PY'
          import torch, transformers, sentence_transformers, langchain, qdrant_client, fastapi, streamlit, nltk, git
          print("torch", torch.__version__, "| transformers", transformers.__version__,
                "| sentence-transformers", sentence_transformers.__version__)
          PY

      - name: Streamlit renders images with this Pillow
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          script = "import numpy as np, streamlit as st\nfrom PIL import Image\nst.image(np.zeros((8, 8, 3), dtype='uint8'))\nst.image(Image.new('RGB', (8, 8), 'red'))\nst.write('ok')\n"
          at = AppTest.from_string(script, default_timeout=60).run()
          assert not at.exception, [e.value for e in at.exception]
          assert [e.type for e in at.main].count("image") == 2, [e.type for e in at.main]
          import PIL
          print("st.image ok with Pillow", PIL.__version__)
          PY

      - name: Compile the source
        run: python -m compileall -q src api dashboard

      - name: Sentence splitting works (nltk)
        run: |
          python - <<'PY'
          import sys, traceback
          try:
              import nltk
              for r in ("punkt", "punkt_tab"):
                  nltk.download(r, quiet=True)
              s = nltk.sent_tokenize("Apple Inc. reported net sales of $383.3 billion. The U.S. share was 42%. See Note 5.")
              print(s)
              assert len(s) == 3, s
          except BaseException:
              print("::error::nltk step failed: " + " | ".join(traceback.format_exc().strip().splitlines()[-5:]))
              sys.exit(1)
          PY

      - name: Load the reranker and score a pair
        run: |
          python -X faulthandler - <<'PY'
          import sys, traceback
          try:
              from sentence_transformers import CrossEncoder
              # CPU on purpose: the macOS runner exposes only ~8 GB of shared GPU memory and runs out of it
              model = CrossEncoder("cross-encoder/ms-marco-MiniLM-L-6-v2", device="cpu")
              scores = model.predict([("What was revenue?", "Revenue for the year was 10 billion dollars."),
                                      ("What was revenue?", "The office cat is orange.")])
              print("scores:", scores)
              assert scores[0] > scores[1], f"reranker ranks an irrelevant sentence higher: {scores}"
          except BaseException:
              print("::error::reranker step failed: " + " | ".join(traceback.format_exc().strip().splitlines()[-5:]))
              sys.exit(1)
          PY

      # The next steps run the README ("Running it") on Linux. Step 4 (ingestion and indexing) needs Ollama and
      # the SEC servers and is not run here, but the API and the dashboard start without them.
      - name: "README step 3: the Qdrant container starts with the exact command"
        if: matrix.os == 'ubuntu-latest'
        run: |
          docker run -d --name qdrant -p 127.0.0.1:6333:6333 -p 127.0.0.1:6334:6334 \
            -v "$(pwd)/qdrant_storage:/qdrant/storage" qdrant/qdrant
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:6333/ >/dev/null; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:6333/ ; echo
          docker port qdrant | tee ports.txt
          grep -q "127.0.0.1" ports.txt

      - name: "README step 5: the API starts and serves /health and /docs"
        if: matrix.os == 'ubuntu-latest'
        run: |
          nohup python -m uvicorn api.main:app --port 8000 > api.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8000/health >/dev/null; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health || { echo "::error::the API did not start"; tail -40 api.log; exit 1; }
          echo
          curl -sf http://127.0.0.1:8000/docs >/dev/null
          curl -sf http://127.0.0.1:8000/openapi.json | python -c "import json,sys; d=json.load(sys.stdin); assert '/ask' in d['paths'] and '/health' in d['paths'], list(d['paths'])"
          echo "API routes: /ask and /health are there"

      - name: "README step 5: the dashboard starts"
        if: matrix.os == 'ubuntu-latest'
        run: |
          nohup python -m streamlit run dashboard/app.py --server.headless true --server.port 8501 > dashboard.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:8501/_stcore/health >/dev/null; then echo "dashboard is up on port 8501"; exit 0; fi
            sleep 2
          done
          echo "::error::the dashboard did not start"
          tail -30 dashboard.log
          exit 1

      - name: Remove the Qdrant container
        if: ${{ always() && matrix.os == 'ubuntu-latest' }}
        run: docker rm -f qdrant || true
