name: Tests

# Unit tests and lint on every push and pull request. The tests replace Qdrant,
# Ollama, the LLM and PyTorch with stand-ins (tests/conftest.py), so this job
# installs only a few light packages and finishes in well under a minute.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt ruff

      - name: Lint
        run: ruff check tests api src/indexing/chunk.py src/retrieval/rag.py src/retrieval/strategies.py src/ingestion/ingest.py src/evaluation/build_eval_set.py src/evaluation/retrieval_eval.py

      - name: Run unit tests
        run: pytest

  demo-in-sync:
    # The public demo lives in a separate lightweight repository (see README).
    # This fails when its copies of demo_app.py / demo_data.json differ from the
    # ones generated here, so the live demo never silently drifts from the project.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Compare with the public demo repository
        run: |
          base=https://raw.githubusercontent.com/DiegoTDDD/sec-filings-rag-demo/main
          status=0
          for file in demo_app.py demo_data.json; do
            curl -fsSL "$base/$file" -o "/tmp/$file"
            if cmp -s "dashboard/$file" "/tmp/$file"; then
              echo "OK: $file matches the public demo"
            else
              echo "::error::$file differs from the public demo. Copy dashboard/$file to the sec-filings-rag-demo repository (see 'Refreshing the public demo' in the README)."
              status=1
            fi
          done
          exit $status
